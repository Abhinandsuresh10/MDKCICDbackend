version: "3.8"

services:
  gateway:
    build: ./gateway
    ports:
      - "5000:5000"
    env_file:
      - ./gateway/.env
    depends_on:
      - auth-service
      - user-service
      - product-service

  auth-service:
    build: ./auth-service
    ports:
      - "5001:5001"
    env_file:
      - ./auth-service/.env

  user-service:
    build: ./user-service
    ports:
      - "5002:5002"
    env_file:
      - ./user-service/.env

  product-service:
    build: ./product-service
    ports:
      - "5003:5003"
    env_file:
      - ./product-service/.env
